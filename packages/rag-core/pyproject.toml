[project]
name = "atlas-core"
version = "0.1.0"
description = "Shared RAG platform core: contracts, config, ingestion, retrieval"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "atlas_core"
